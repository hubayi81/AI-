<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI鞋类商品推荐助手</title>
    <style>
        :root {
            --ink: #1A1A2E; --cream: #FEF9F0; --gold: #F5851F;
            --gold-light: #FFB347; --white: #FFF; --warm-gray: #8C8279;
            --border-subtle: #E8DFD3; --success: #3C9D70; --danger: #E0554A;
            --bg-ai: #FFF; --bg-user: #1A1A2E;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--cream);
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", -apple-system, sans-serif;
            color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;
        }

        /* ====== 导航栏 ====== */
        .nav-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(26,26,46,0.94); backdrop-filter: blur(16px);
            padding: 0 40px; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .nav-logo {
            font-family: "Arial Black", "Impact", "PingFang SC", sans-serif;
            font-size: 18px; font-weight: 900; color: var(--white); letter-spacing: 2px;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-logo-dot {
            width: 8px; height: 8px; background: var(--gold);
            animation: dotPulse 1.5s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.4; }
        }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-user { color: rgba(255,255,255,0.6); font-size: 13px; }
        .btn-out {
            background: transparent; border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.55); font-size: 12px; padding: 6px 18px;
            cursor: pointer; letter-spacing: 2px; font-family: inherit;
            transition: all 0.25s ease;
        }
        .btn-out:hover { border-color: var(--danger); color: var(--danger); }

        /* ====== 聊天容器 ====== */
        .chat-container {
            flex: 1; max-width: 800px; margin: 0 auto; width: 100%;
            display: flex; flex-direction: column; padding: 0 20px;
        }

        /* ====== 消息列表 ====== */
        .chat-messages {
            flex: 1; overflow-y: auto; padding: 24px 0;
            display: flex; flex-direction: column; gap: 20px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #D6CBB8; border-radius: 2px; }

        /* ====== 快捷按钮 ====== */
        .quick-actions {
            display: flex; gap: 10px; padding: 16px 0; flex-wrap: wrap;
        }
        .btn-quick {
            padding: 10px 20px; font-size: 13px; font-family: inherit;
            background: var(--white); border: 1px solid var(--border-subtle);
            color: var(--ink); cursor: pointer; letter-spacing: 1px;
            transition: all 0.25s ease;
        }
        .btn-quick:hover {
            border-color: var(--gold); color: var(--gold);
            transform: translateY(-2px);
        }

        /* ====== 消息气泡 ====== */
        .msg-row { display: flex; gap: 12px; animation: msgIn 0.35s ease both; }
        .msg-row.user { flex-direction: row-reverse; }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-avatar {
            width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 900;
        }
        .ai .msg-avatar { background: #FFF4E8; color: var(--gold); }
        .user .msg-avatar { background: var(--ink); color: var(--white); font-size: 14px; }
        .msg-bubble {
            max-width: 78%; padding: 16px 20px; line-height: 1.7; font-size: 14px;
        }
        .ai .msg-bubble { background: var(--white); color: var(--ink); }
        .user .msg-bubble { background: var(--ink); color: var(--white); }

        /* ====== 商品推荐卡片（嵌在 AI 消息里） ====== */
        .rec-cards { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
        .rec-card {
            display: flex; align-items: center; gap: 16px;
            background: #FAF7F2; padding: 14px 16px;
            border-left: 3px solid var(--gold);
            transition: all 0.25s ease;
        }
        .rec-card:hover { background: #FFF4E8; transform: translateX(4px); }
        .rec-rank {
            font-family: "Arial Black", "Impact", sans-serif;
            font-size: 24px; font-weight: 900; color: var(--gold); min-width: 36px;
        }
        .rec-info { flex: 1; }
        .rec-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .rec-reason { font-size: 12px; color: var(--warm-gray); line-height: 1.6; }
        .rec-right { text-align: right; flex-shrink: 0; }
        .rec-score {
            font-family: "Arial Black", "Impact", sans-serif;
            font-size: 20px; font-weight: 900; color: var(--ink);
        }
        .rec-score span { font-size: 11px; color: var(--warm-gray); }
        .rec-price { font-size: 12px; color: var(--gold); font-weight: 700; margin-top: 2px; }

        /* ====== 加载动画 ====== */
        .typing { display: flex; gap: 5px; padding: 8px 0; }
        .typing span {
            width: 8px; height: 8px; background: var(--warm-gray); border-radius: 50%;
            animation: bounce 1.2s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%,60%,100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* ====== 输入栏 ====== */
        .chat-input-bar {
            display: flex; gap: 12px; padding: 20px 0 32px;
            border-top: 1px solid var(--border-subtle);
        }
        .chat-input {
            flex: 1; padding: 14px 18px; font-size: 14px; font-family: inherit;
            background: var(--white); border: 1px solid var(--border-subtle);
            color: var(--ink); outline: none; transition: all 0.25s ease;
        }
        .chat-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(245,133,31,0.08); }
        .chat-input::placeholder { color: #C4B8AA; }
        .chat-input:disabled { background: #F5F0E8; }
        .btn-send {
            padding: 14px 28px; font-size: 14px; font-weight: 700; font-family: inherit;
            letter-spacing: 2px; cursor: pointer; border: none;
            background: var(--gold); color: #fff;
            transition: all 0.25s ease; white-space: nowrap;
        }
        .btn-send:hover:not(:disabled) { background: var(--ink); transform: translateY(-2px); }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ====== 下拉提示 ====== */
        .offline-banner {
            text-align: center; padding: 8px 20px; font-size: 12px;
            color: var(--danger); background: #FFF0EE; margin: 12px 20px 0;
        }
        .empty-chat {
            text-align: center; padding: 60px 20px; color: var(--warm-gray);
        }
        .empty-chat .big-icon { font-size: 48px; margin-bottom: 16px; }

        @media (max-width: 640px) {
            .nav-bar { padding: 0 16px; }
            .msg-bubble { max-width: 88%; }
            .chat-container { padding: 0 12px; }
            .quick-actions { gap: 8px; }
            .btn-quick { padding: 8px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

<nav class="nav-bar">
    <div class="nav-logo">
        <div class="nav-logo-dot"></div>AI鞋类导购 Agent
    </div>
    <div class="nav-right">
        <span v-if="user" class="nav-user">{{ user.username }}</span>
        <button @click="logout" class="btn-out">退出</button>
    </div>
</nav>

<div class="chat-container" id="app">
    <!-- AI 离线提示 -->
    <div v-if="!aiOnline" class="offline-banner">
        AI 助手暂时离线，请使用传统筛选模式
    </div>

    <!-- 快捷按钮 -->
    <div class="quick-actions">
        <button class="btn-quick" @click="quickSend('专业跑步')" :disabled="loading">👟 专业跑步</button>
        <button class="btn-quick" @click="quickSend('日常通勤')" :disabled="loading">🚶 日常通勤</button>
        <button class="btn-quick" @click="quickSend('男生一双可以搭配的鞋，平时牛仔裤白T恤')" :disabled="loading">👔 穿搭搭配</button>
        <button class="btn-quick" @click="quickSend('帮我推荐一双鞋')" :disabled="loading">🔍 帮我推荐</button>
    </div>

    <!-- 消息列表 -->
    <div class="chat-messages" ref="msgContainer">
        <!-- 欢迎消息 -->
        <div v-if="messages.length === 0" class="empty-chat">
            <div class="big-icon">👟</div>
            <div style="font-size:16px;font-weight:700;margin-bottom:8px;">你好！想找什么鞋？</div>
            <div style="font-size:13px;">直接告诉我你的需求，比如"跑步穿的缓震鞋，预算500以内"</div>
        </div>

        <!-- 消息 -->
        <div v-for="(msg, i) in messages" :key="i"
             :class="'msg-row ' + msg.role">
            <div class="msg-avatar">{{ msg.role === 'ai' ? '🤖' : '👤' }}</div>
            <div class="msg-bubble">
                <div v-html="msg.content"></div>

                <!-- 推荐商品卡片 -->
                <div v-if="msg.results && msg.results.length > 0" class="rec-cards">
                    <div v-for="(r, j) in msg.results" :key="j" class="rec-card">
                        <div class="rec-rank">{{ j + 1 }}</div>
                        <div class="rec-info">
                            <div class="rec-name">{{ r.name }}</div>
                            <div class="rec-reason">{{ r.reason }}</div>
                        </div>
                        <div class="rec-right">
                            <div class="rec-score">{{ r.score }}<span> 分</span></div>
                            <div class="rec-price" v-if="findPrice(r)">¥{{ findPrice(r) }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 加载中 -->
        <div v-if="loading" class="msg-row ai">
            <div class="msg-avatar">🤖</div>
            <div class="msg-bubble">
                <div class="typing"><span></span><span></span><span></span></div>
            </div>
        </div>
    </div>

    <!-- 输入栏 -->
    <div class="chat-input-bar">
        <input class="chat-input"
               v-model="inputText"
               @keyup.enter="send"
               :disabled="loading"
               placeholder="输入你的需求，如：男生跑步脚宽预算400...">
        <button class="btn-send" @click="send" :disabled="loading || !inputText.trim()">
            发送
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script>
    const { createApp } = Vue
    createApp({
        data() {
            return {
                user: null,
                inputText: '',
                conversationId: null,
                messages: [],
                loading: false,
                aiOnline: true,
                allProducts: []
            }
        },
        async mounted() {
            // 登录检查
            const res = await fetch('/api/user/status')
            const data = await res.json()
            if (data.code !== 200) { window.location.href = '/login.html'; return }
            this.user = data.data

            // 预加载商品列表（给推荐卡片查价格用）
            this.loadProducts()

            // 检查 AI 状态
            this.checkHealth()
        },
        methods: {
            async loadProducts() {
                try {
                    const r = await fetch('/api/products')
                    const d = await r.json()
                    if (d.code === 200) this.allProducts = d.data
                } catch(e) {}
            },
            async checkHealth() {
                try {
                    const r = await fetch('/api/ai/health')
                    const d = await r.json()
                    this.aiOnline = d.data?.online || false
                } catch(e) { this.aiOnline = false }
            },
            findPrice(result) {
                const p = this.allProducts.find(x => x.id === result.productId)
                return p ? p.price : null
            },
            quickSend(text) {
                this.inputText = text
                this.send()
            },
            async send() {
                const msg = this.inputText.trim()
                if (!msg || this.loading) return

                // 添加用户消息
                this.messages.push({ role: 'user', content: this.escapeHtml(msg) })
                this.inputText = ''
                this.loading = true
                this.$nextTick(() => this.scrollBottom())

                try {
                    const r = await fetch('/api/ai/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            conversation_id: this.conversationId,
                            message: msg
                        })
                    })
                    const d = await r.json()
                    const resp = d.data

                    // 存会话 ID
                    this.conversationId = resp.conversation_id

                    // 处理回复中的 Markdown
                    const replyHtml = this.formatReply(resp.reply)

                    // 添加 AI 消息
                    this.messages.push({
                        role: 'ai',
                        content: replyHtml,
                        action: resp.action,
                        results: resp.results || []
                    })
                } catch(e) {
                    this.messages.push({
                        role: 'ai',
                        content: '抱歉，AI 服务暂时不可用，请稍后再试。',
                        action: 'chat',
                        results: []
                    })
                } finally {
                    this.loading = false
                    this.$nextTick(() => this.scrollBottom())
                }
            },
            escapeHtml(text) {
                const div = document.createElement('div')
                div.textContent = text
                return div.innerHTML
            },
            formatReply(text) {
                // 换行转 <br>，简单处理
                let html = this.escapeHtml(text)
                html = html.replace(/\n/g, '<br>')
                // 去掉结尾的 JSON 代码块
                html = html.replace(/```json[\s\S]*?```/g, '')
                return html
            },
            scrollBottom() {
                const el = this.$refs.msgContainer
                if (el) el.scrollTop = el.scrollHeight
            },
            async logout() {
                await fetch('/api/user/logout', { method: 'POST' })
                window.location.href = '/login.html'
            }
        }
    }).mount('#app')
</script>
</body>
</html>
